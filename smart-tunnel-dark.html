<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SMART Tunnel</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(800px,100% - 32px);margin:64px auto 96px}
</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.st .iso-plate {
  overflow: hidden;
}

.st {
  --st-void: #5d6366;
  --st-water: #7f979f;
  --st-silt: #a08c70;
  --st-lamp-off: #c9c9cc;
  --st-lamp-on: #000000;
  --st-amber: #d98a1a;
  --st-go: #2f9e63;
  --st-stop: #d6403d;
}

.iso[data-theme="dark"] .st {
  --st-void: #050505;
  --st-water: #3f6f86;
  --st-silt: #6b5a42;
  --st-lamp-off: #2a2a2a;
  --st-lamp-on: #ffffff;
}

.st-credit {
  position: absolute;
  top: 34px;
  right: 20px;
  color: var(--anatomy-muted);
  font-family: var(--anatomy-mono);
  font-size: 9.5px;
  letter-spacing: 0.06em;
  line-height: 1;
  pointer-events: none;
}

.st-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  cursor: ew-resize;
  margin: 0 -8px;
}

.st-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

.st-said {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.st-stage > svg,
.st-stage > canvas {
  display: block;
  width: 100%;
  height: auto;
}

.st-stage > .st-layer {
  position: absolute;
  inset: 0;
  height: 100% !important;
  pointer-events: none;
}

.st-stage[data-gl] .st-fallback {
  display: none;
}

.st-void {
  fill: var(--st-void);
  stroke: none;
}

.st-water {
  fill: var(--st-water);
  fill-opacity: 0.55;
  stroke: none;
}

.st-silt path {
  fill: var(--st-silt);
  stroke: none;
}

.st-lamp {
  fill: var(--st-lamp-off);
}

.st-lamp[data-on] {
  fill: var(--st-lamp-on);
}

.st-signal {
  fill: var(--st-lamp-off);
}

.st-signal[data-state="go"] {
  fill: var(--st-go);
}

.st-signal[data-state="stop"] {
  fill: var(--st-stop);
}

.st-beacon {
  fill: var(--st-amber);
}

@media (max-width: 560px) {
  .st-credit {
    top: 32px;
    right: 12px;
    font-size: 8.5px;
  }
  .st-stage {
    margin: 0 -10px;
  }
}

.st-stripe {
  fill: var(--st-stop);
  stroke: none;
}

 Mode 4 the bore drains, crews wash out the silt and the motorway typically reopens within 48 hours. The cross-section is to scale (one ruler tick a metre); the length is not, and storm hours run compressed while the cars move at true speed.</span></figcaption></figure></div></main><script type="module">const AZIMUTH = 45;

`;
const GLSL_ISO = `precision highp float;
uniform vec2 uCanvas;
uniform vec2 uView;
uniform vec2 uOrigin;
uniform float uK;
uniform vec4 uCam;
uniform float uTime;
vec2 viewOf(vec2 frag){return vec2(frag.x,uCanvas.y-frag.y)*(uView.x/uCanvas.x);}
vec2 project(vec3 p){return uOrigin+uK*vec2(p.x*uCam.x-p.y*uCam.y,(p.x*uCam.y+p.y*uCam.x)*uCam.z-p.z*uCam.w);}
vec3 towardViewer(){return vec3(uCam.y*uCam.w,uCam.x*uCam.w,uCam.z);}
vec3 rayOf(vec2 vb){vec2 q=(vb-uOrigin)/uK;return vec3(q.x*uCam.x,-q.x*uCam.y,-q.y/uCam.w);}
float pixelOf(){return (uView.x/uCanvas.x)/uK;}
vec3 lightDir(){return normalize(vec3(-uCam.x,uCam.y,1.2));}
vec3 onFloor(vec2 vb,float h){vec2 q=(vb-uOrigin)/uK;float b=(q.y+h*uCam.w)/uCam.z;return vec3(q.x*uCam.x+b*uCam.y,-q.x*uCam.y+b*uCam.x,h);}
vec3 onWallY(vec2 vb,float y){vec2 q=(vb-uOrigin)/uK;float x=(q.x+y*uCam.y)/uCam.x;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
vec3 onWallX(vec2 vb,float x){vec2 q=(vb-uOrigin)/uK;float y=(x*uCam.x-q.x)/uCam.y;return vec3(x,y,((x*uCam.y+y*uCam.x)*uCam.z-q.y)/uCam.w);}
float hash12(vec2 p){vec3 q=fract(vec3(p.xyx)*.1031);q+=dot(q,q.yzx+33.33);return fract((q.x+q.y)*q.z);}
float hash13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise2(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),f.x),mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),f.x),f.y);}
float noise3(vec3 p){vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.-2.*f);
  float a=mix(mix(hash13(i),hash13(i+vec3(1.,0.,0.)),f.x),mix(hash13(i+vec3(0.,1.,0.)),hash13(i+vec3(1.,1.,0.)),f.x),f.y);
  float b=mix(mix(hash13(i+vec3(0.,0.,1.)),hash13(i+vec3(1.,0.,1.)),f.x),mix(hash13(i+vec3(0.,1.,1.)),hash13(i+vec3(1.,1.,1.)),f.x),f.y);
  return mix(a,b,f.z);}
float fbm2(vec2 p){float s=0.;float a=.5;for(int i=0;i<4;i++){s+=a*noise2(p);p=p*2.07+vec2(17.1,9.2);a*=.5;}return s/.9375;}
float fbm3(vec3 p){float s=0.;float a=.5;for(int i=0;i<4;i++){s+=a*noise3(p);p=p*2.07+vec3(17.1,9.2,4.7);a*=.5;}return s/.9375;}
float window(float x,float a,float b,float soft){return smoothstep(a-soft,a+soft,x)*(1.-smoothstep(b-soft,b+soft,x));}
vec3 tonemap(vec3 c,float exposure){return 1.-exp(-c*exposure);}
`;

const GLSL_TURN = `uniform vec3 uGroupX;
uniform vec3 uGroupY;
uniform vec3 uGroupZ;
uniform vec3 uGroupT;
uniform vec3 uCoverEdge[60];
uniform float uCoverCount[6];
vec3 toGroup(vec3 p){vec3 q=p-uGroupT;return vec3(dot(q,uGroupX),dot(q,uGroupY),dot(q,uGroupZ));}
vec3 toWorld(vec3 g){return uGroupT+g.x*uGroupX+g.y*uGroupY+g.z*uGroupZ;}
vec3 dirToGroup(vec3 d){return vec3(dot(d,uGroupX),dot(d,uGroupY),dot(d,uGroupZ));}
vec3 dirToWorld(vec3 d){return d.x*uGroupX+d.y*uGroupY+d.z*uGroupZ;}
float coverOf(vec2 vb,float soft){float c=0.;for(int p=0;p<6;p++){float n=uCoverCount[p];float inside=-1e4;for(int e=0;e<10;e++){if(float(e)>=n)break;vec3 h=uCoverEdge[p*10+e];inside=max(inside,h.x*vb.x+h.y*vb.y+h.z);}if(n>0.)c=max(c,1.-smoothstep(-soft,soft,inside));}return c;}
`;

function glslPose(name, prefix = `u${name}`) {
  return `uniform vec3 ${prefix}X;uniform vec3 ${prefix}Y;uniform vec3 ${prefix}Z;uniform vec3 ${prefix}T;
vec3 to${name}(vec3 p){vec3 q=p-${prefix}T;return vec3(dot(q,${prefix}X),dot(q,${prefix}Y),dot(q,${prefix}Z));}
vec3 from${name}(vec3 g){return ${prefix}T+g.x*${prefix}X+g.y*${prefix}Y+g.z*${prefix}Z;}
vec3 dirTo${name}(vec3 d){return vec3(dot(d,${prefix}X),dot(d,${prefix}Y),dot(d,${prefix}Z));}
vec3 dirFrom${name}(vec3 d){return d.x*${prefix}X+d.y*${prefix}Y+d.z*${prefix}Z;}
`;
}

function glCamera(projection) {
  const a = ((projection.azimuth ?? 45) * Math.PI) / 180;
  const e = ((projection.elevation ?? 30) * Math.PI) / 180;
  return {
    origin: [projection.origin[0], projection.origin[1]],
    k: projection.scale * Math.sqrt(1.6),
    cam: [Math.sin(a), Math.cos(a), Math.sin(e), Math.cos(e)],
  };
}

const VERTEX = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

function glLayer({ canvas, fragment, view, camera, uniforms = [], fixed = {}, extensions = [], maxRatio = 1.5, onError = (message) => console.error(message) }) {
  const gl = canvas.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: false });
  if (!gl) return null;
  const compile = (type, source) => {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
    onError(gl.getShaderInfoLog(shader));
    return null;
  };
  const vs = compile(gl.VERTEX_SHADER, VERTEX);
  const enabled = extensions.filter((name) => gl.getExtension(name.replace(/^GL_/, "")));
  const fs = compile(gl.FRAGMENT_SHADER, enabled.map((name) => `#extension ${name} : enable\n`).join("") + GLSL_ISO + fragment);
  if (!vs || !fs) return null;
  const program = gl.createProgram();
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    onError(gl.getProgramInfoLog(program));
    return null;
  }
  gl.useProgram(program);
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "p");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  const where = {};
  for (const name of ["uCanvas", "uView", "uOrigin", "uK", "uCam", "uTime", ...uniforms, ...Object.keys(fixed)]) where[name] = gl.getUniformLocation(program, name);
  const types = {};
  const active = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let index = 0; index < active; index++) {
    const info = gl.getActiveUniform(program, index);
    if (info) types[info.name.replace(/\[0\]$/, "")] = info.type;
  }
  let painted = false;
  const fit = () => {
    const box = canvas.getBoundingClientRect();
    const ratio = Math.min(maxRatio, window.devicePixelRatio || 1);
    const width = Math.max(1, Math.round(box.width * ratio));
    const height = Math.max(1, Math.round(box.height * ratio));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  };
  const set = (name, value) => {
    const at = where[name];
    if (at === undefined || at === null) return;
    if (typeof value === "number") gl.uniform1f(at, value);
    else if (value.length > 4) {
      const data = value instanceof Float32Array ? value : new Float32Array(value);
      const type = types[name];
      if (type === gl.FLOAT_VEC2) gl.uniform2fv(at, data);
      else if (type === gl.FLOAT_VEC3) gl.uniform3fv(at, data);
      else if (type === gl.FLOAT_VEC4) gl.uniform4fv(at, data);
      else gl.uniform1fv(at, data);
    }
    else if (value.length === 1) gl.uniform1f(at, value[0]);
    else if (value.length === 2) gl.uniform2f(at, value[0], value[1]);
    else if (value.length === 3) gl.uniform3f(at, value[0], value[1], value[2]);
    else if (value.length === 4) gl.uniform4f(at, value[0], value[1], value[2], value[3]);
  };
  for (const [name, value] of Object.entries(fixed)) set(name, value);
  return {
    gl,
    extensions: enabled,
    set(values = {}) {
      for (const [name, value] of Object.entries(values)) set(name, value);
    },
    draw(values = {}, time = 0) {
      fit();
      gl.viewport(0, 0, canvas.width, canvas.height);
      set("uCanvas", [canvas.width, canvas.height]);
      set("uView", view);
      set("uOrigin", camera.origin);
      set("uK", camera.k);
      set("uCam", camera.cam);
      set("uTime", time);
      for (const [name, value] of Object.entries(values)) set(name, value);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      painted = true;
    },
    clear() {
      if (!painted) return;
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      painted = false;
    },
  };
}

const smooth = (a, b, x) => {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
};

const burst = (age, rise, fall) => (age > 0 ? smooth(0, rise, age) * Math.exp(-Math.max(0, age - rise) / fall) : 0);

function settle(state, target, dt, seconds, calm = false) {
  if (calm) {
    state.x = target;
    state.v = 0;
    return false;
  }
  const w = 1 / seconds;
  for (let index = 0; index < 4; index++) {
    const h = dt / 4;
    state.v += (w * w * (target - state.x) - 2 * w * state.v) * h;
    state.x += state.v * h;
  }
  if (Math.abs(target - state.x) < 1e-4 && Math.abs(state.v) < 1e-4) {
    state.x = target;
    state.v = 0;
    return false;
  }
  return true;
}
// SMART Tunnel, Kuala Lumpur (2007). Pure numbers and the operating modes.
// Sources: SMART project page (construction.smarttunnel.com.my), Bernama / The Star reports
// of mode activations (Mode 2 at 70 m³/s, Mode 3 at 150 m³/s at the Klang–Ampang confluence).
// [Bracketed] values are placeholders set by judgement, not published figures.

const TUNNEL = {
  bore: 13.2, // m, TBM cut diameter
  inner: 11.83, // m, finished inside diameter
  length: 9.7, // km, stormwater tunnel
  motorway: 3, // km, double-deck section inside it
  decks: 2,
  lanes: 2, // per deck, one way, light vehicles only
  limit: 60, // km/h
};

const STORE = {
  berembang: 600000, // m³, upstream holding pond at Kampung Berembang
  tunnel: 1000000, // m³, the bore itself
  tamanDesa: 1400000, // m³, downstream ex-mining pond at Taman Desa
};
const CAPACITY = STORE.berembang + STORE.tunnel + STORE.tamanDesa; // 3 million m³
const PONDS = STORE.berembang + STORE.tamanDesa;

const MODE2 = 70; // m³/s at the confluence: divert into the lower channel
const MODE3 = 150; // m³/s: close the motorway
const REOPEN_AFTER_FLOOD = 48; // h, typical reopening after Mode 4
const REOPEN_AFTER_CLOSE = [1]; // h, [inspection after a Mode 3 closure that stayed dry]
const RELEASE = [30]; // m³/s, [controlled release from Taman Desa to the Kerayong]
const DRAIN = [55]; // m³/s, [release while the bore empties after Mode 4]

// Rainfall stops: none, moderate, major, prolonged. Flow at the confluence each one settles to.
const RAIN = [
  { name: "no storm", flow: 28 },
  { name: "moderate storm", flow: 112 },
  { name: "major storm", flow: 192 },
  { name: "prolonged storm", flow: 265 },
];

// Figure time: hours of storm per second of animation (cars always run at true speed).
const HOURS_PER_S = { storm: 0.55, drain: 1.1, clean: 5 };
const FLOW_TAU = 2.2; // s of figure time for the river to answer the rain

const PHASES = {
  open: { mode: 1, deck: "open" },
  channel: { mode: 2, deck: "open" },
  closing: { mode: 3, deck: "closing" },
  closed: { mode: 3, deck: "closed" },
  flooding: { mode: 4, deck: "flooding" },
  flooded: { mode: 4, deck: "flooded" },
  draining: { mode: 4, deck: "draining" },
  cleaning: { mode: 1, deck: "cleaning" },
};

function initial() {
  return { flow: RAIN[0].flow, stored: 0, phase: "open", reopen: 0, gate: 0, fill: 0, silt: 0, clock: 0 };
}

// Advance the operating state by dt seconds of figure time.
// rain: stop 0..3; cars: vehicles still on the decks (from the live layer).
function step(s, rain, cars, dt) {
  const n = { ...s };
  const hourRate = s.phase === "cleaning" ? HOURS_PER_S.clean : s.phase === "draining" ? HOURS_PER_S.drain : HOURS_PER_S.storm;
  const dh = dt * hourRate;
  n.clock = s.clock + dh;
  n.flow = s.flow + (RAIN[rain].flow - s.flow) * (1 - Math.exp(-dt / FLOW_TAU));

  const inflow = n.flow > MODE2 ? n.flow - MODE2 : 0;
  const out = s.phase === "draining" ? DRAIN[0] : s.stored > 0 ? RELEASE[0] : 0;
  // The bore takes water only once its gates swing open, and holds it until it has drained.
  const room = s.phase === "flooding" ? PONDS + STORE.tunnel * s.gate : s.phase === "flooded" || s.phase === "draining" ? CAPACITY : PONDS;
  n.stored = Math.min(room, Math.max(0, s.stored + (inflow - out) * 3600 * dh));
  // The ponds take the water first; only an open bore (Mode 4) holds the last million.
  n.fill = Math.max(0, Math.min(1, (n.stored - PONDS) / STORE.tunnel));

  const next = () => (n.flow > MODE3 ? "closed" : n.flow > MODE2 ? "channel" : "open");
  switch (s.phase) {
    case "open":
      if (n.flow > MODE3) n.phase = "closing";
      else if (n.flow > MODE2) n.phase = "channel";
      break;
    case "channel":
      if (n.flow > MODE3) n.phase = "closing";
      else if (n.flow < MODE2) n.phase = "open";
      break;
    case "closing":
      if (cars === 0) n.phase = "closed";
      break;
    case "closed":
      if (n.flow > MODE3) {
        n.reopen = 0;
        if (n.stored >= PONDS * 0.985) n.phase = "flooding";
      } else {
        n.reopen = s.reopen > 0 ? s.reopen - dh : REOPEN_AFTER_CLOSE[0];
        if (n.reopen <= 0) {
          n.reopen = 0;
          n.phase = next();
        }
      }
      break;
    case "flooding":
      n.gate = Math.min(1, s.gate + dt / 3.2);
      if (n.fill >= 0.999) n.phase = "flooded";
      else if (n.flow < MODE3 && n.gate >= 1) n.phase = "draining";
      break;
    case "flooded":
      if (n.flow < MODE3) n.phase = "draining";
      break;
    case "draining":
      // Gates stay open until the bore has emptied back into the ponds and the river.
      n.reopen = Math.max(0, s.reopen - dh);
      n.silt = Math.min(1, s.silt + dt / 2);
      if (n.fill <= 0) {
        n.gate = Math.max(0, s.gate - dt / 3.2);
        if (n.gate <= 0) n.phase = "cleaning";
      }
      break;
    case "cleaning":
      n.reopen = Math.max(0, s.reopen - dh);
      n.silt = Math.min(1, n.reopen / (REOPEN_AFTER_FLOOD * 0.8));
      if (n.reopen <= 0) n.phase = next();
      break;
  }
  if (s.phase !== "draining" && n.phase === "draining") n.reopen = REOPEN_AFTER_FLOOD;
  if (n.phase === "open" || n.phase === "channel") n.silt = 0;
  return n;
}

// Water depth in the lower channel (m above invert) for a diverted flow, and whether traffic may enter.
const CHANNEL_DEPTH = 3.4; // m from invert to the lower deck soffit
function channelDepth(flow, phase) {
  if (phase === "flooding" || phase === "flooded") return CHANNEL_DEPTH;
  const diverted = Math.max(0, flow - MODE2);
  return CHANNEL_DEPTH * 0.92 * Math.min(1, Math.pow(diverted / 150, 0.6));
}
const trafficOpen = (phase) => phase === "open" || phase === "channel";

const million = (v) => (v / 1e6).toFixed(2);
function readoutOf(s) {
  const p = PHASES[s.phase];
  const parts = [`Mode ${p.mode}`, `${Math.round(s.flow)} m³/s`, `${million(s.stored)} M m³`, p.deck];
  if (s.reopen > 0) parts.push(`reopens in ${Math.ceil(s.reopen)} h`);

}

// ------------------------------------------------------------ water shader
// Two canvases share one fragment: the river and pond under the drawing (uWhich 0), and the bore
// water between the decks and the lining's cut faces (uWhich 1). Every face is a world plane,
// so it registers with the SVG; colour comes from the optical path through turbid water.
const pale = !!stage.closest('[data-theme="light"]');
const f1 = (v) => v.toFixed(2);
const WATER_GLSL = `
uniform float uWhich;uniform float uLight;
uniform float uBore;uniform float uChan;uniform float uRiver;uniform float uPond;uniform float uFlow;uniform float uBoreFlow;uniform float uFirst;
const float X0=${f1(D.X0 + D.BULK)};const float X1=${f1(D.X1)};const float YC=${f1(D.YC)};const float YU=${f1(D.YU)};
const float ZC=${f1(D.ZC)};const float RI=${f1(D.RI)};const float ZB=${f1(D.ZC + D.ZB)};const float ZT=${f1(D.ZC + D.ZT)};
const vec2 LOWZ=vec2(${f1(D.ZC + D.LOW[0])},${f1(D.ZC + D.LOW[1])});const vec2 UPZ=vec2(${f1(D.ZC + D.UPP[0])},${f1(D.ZC + D.UPP[1])});
const vec4 RIV=vec4(${f1(D.RIVER.x0)},${f1(D.RIVER.y0)},${f1(D.RIVER.x1)},${f1(D.RIVER.y1)});const float RBED=${f1(D.RIVER.bed)};
const vec4 PON=vec4(${f1(D.POND.x + D.POND.t)},${f1(D.POND.y + D.POND.t)},${f1(D.POND.x + D.POND.w - D.POND.t)},${f1(D.POND.y + D.POND.d - D.POND.t)});const float PBED=${f1(D.POND.floor)};
const vec3 DEEP=vec3(.25,.42,.52);const vec3 SILT=vec3(.50,.47,.38);const vec3 DARKW=vec3(.16,.32,.40);
vec4 inkFor(vec3 seen,float cover){vec3 absorbed=1.-seen;float a=max(max(absorbed.r,max(absorbed.g,absorbed.b)),cover);return vec4(vec3(a)-absorbed,a);}
vec4 over(vec4 top,vec4 under){return top+under*(1.-top.a);}
float wOf(float z){float r=z-ZC;return sqrt(max(RI*RI-r*r,0.));}
// Path length from p, away from the viewer, until the ray meets something solid inside the bore.
float boreDepth(vec3 p){
  vec3 v=towardViewer();
  float t=1e4;
  if(p.z>LOWZ.y+.01)t=min(t,(p.z-LOWZ.y)/v.z);
  if(p.z>UPZ.y+.01){float s=(p.z-UPZ.y)/v.z;if(p.y-s*v.y<YU)t=min(t,s);}
  if(p.y>YU+.01&&p.z>UPZ.x&&p.z<UPZ.y+30.){float s=(p.y-YU)/v.y;float z=p.z-s*v.z;if(z>UPZ.x&&z<UPZ.y)t=min(t,s);}
  float b=p.y*v.y+(p.z-ZC)*v.z;float c=p.y*p.y+(p.z-ZC)*(p.z-ZC)-RI*RI;float a=v.y*v.y+v.z*v.z;
  float disc=b*b-a*c;if(disc>0.)t=min(t,(b+sqrt(disc))/a);
  t=min(t,max(p.x-X0,0.)/v.x);
  return max(t,0.);
}
float streak(vec2 q,float speed,float scale){
  float n=fbm2(vec2((q.x-uTime*speed)*.045*scale,q.y*.32*scale));
  float m=fbm2(vec2((q.x-uTime*speed*1.35)*.11*scale+7.,q.y*.9*scale));
  return smoothstep(.55,.8,n)*.7+smoothstep(.62,.85,m)*.4;
}
vec3 waterSeen(float d,float foam,float face){
  float e=1.-exp(-d/22.);
  vec3 seen=mix(vec3(.93,.96,.97),mix(DEEP,SILT,.28),e*.95);
  seen=mix(seen,seen*.9,face);
  return mix(seen,vec3(.97,.98,.98),foam*.45*(.4+.6*e));
}
vec4 shade(float d,float foam,float face,float cover){
  vec3 seen=waterSeen(d,foam,face);
  vec4 ink=inkFor(seen,cover);
  vec4 dark=vec4(DARKW*(.5+.5*(1.-exp(-d/34.)))+foam*.18,1.)*(.35+.55*(1.-exp(-d/30.)));
  return mix(dark,ink,uLight);
}
vec4 bore(vec2 vb,float px){
  vec4 col=vec4(0.);
  float level=max(uBore,uChan);
  if(level<ZB+.05)return col;
  float top=min(level,ZT);
  // Front face in the cut plane y = YC.
  vec3 q=onWallY(vb,YC);
  float inFace=window(q.x,X0,X1,.7*px)*window(q.z,ZB,top,.7*px/uCam.w);
  if(inFace>.001){
    float d=boreDepth(q);
    float foam=streak(vec2(q.x,q.z),uBoreFlow,1.);
    col=shade(d,foam*.8,1.,.32)*inFace;
  }
  // Free surface (or the top cut when full), unless a deck above hides it.
  vec3 p=onFloor(vb,top);
  float inTop=window(p.x,X0,X1,.7*px)*window(p.y,-wOf(top),YC,.7*px/uCam.z);
  vec3 v=towardViewer();
  if(top<LOWZ.x){float s=(LOWZ.x-top)/v.z;inTop*=smoothstep(YC-.6*px,YC+.6*px,p.y+s*v.y);}
  if(top<UPZ.x){float s=(UPZ.x-top)/v.z;inTop*=smoothstep(YU-.6*px,YU+.6*px,p.y+s*v.y);}
  if(inTop>.001){
    float d=boreDepth(p-vec3(0.,0.,.05));
    float foam=streak(vec2(p.x,p.y),uBoreFlow,1.);
    col=over(col,shade(d,foam,0.,.26)*inTop);
  }
  return col;
}
vec4 open(vec2 vb,float px){
  vec4 col=vec4(0.);
  // River: surface and its cut face at the downstream end of the channel segment.
  vec3 p=onFloor(vb,uRiver);
  float inR=window(p.x,RIV.x,RIV.z,.7*px)*window(p.y,RIV.y,RIV.w,.7*px/uCam.z);
  if(inR>.001){
    float d=min((uRiver-RBED)/uCam.z,(p.y-RIV.y)/(uCam.y*uCam.w)+(uRiver-RBED));
    col=shade(d+4.,streak(vec2(p.x,p.y),uFlow,1.3),0.,.12)*inR;
  }
  vec3 q=onWallX(vb,RIV.z);
  float inF=window(q.y,RIV.y,RIV.w,.7*px)*window(q.z,RBED,uRiver,.7*px/uCam.w);
  if(inF>.001)col=over(col,shade(12.+(q.y-RIV.y)*.3,streak(vec2(q.y*.4,q.z),0.,1.)*.3,1.,.16)*inF);
  // Pond: still water, a slow drift away from the inlet.
  vec3 o=onFloor(vb,uPond);
  float inP=window(o.x,PON.x,PON.z,.7*px)*window(o.y,PON.y,PON.w,.7*px/uCam.z);
  if(inP>.001){
    float d=(uPond-PBED)/uCam.z;
    float ripple=smoothstep(.6,.85,fbm2(vec2(o.x*.05+uTime*.05,o.y*.12)))*.5;
    col=over(col,shade(d+6.,ripple,0.,.12)*inP);
  }
  return col;
}
void main(){
  vec2 vb=viewOf(gl_FragCoord.xy);
  float px=pixelOf();
  vec4 col=uWhich<.5?open(vb,px):bore(vb,px);
  col.rgb=min(col.rgb,vec3(col.a));
  float n=(hash12(gl_FragCoord.xy+fract(uTime*.61)*91.)+hash12(gl_FragCoord.yx*1.37+fract(uTime*.37)*57.)-1.)/255.;
  col=max(col+n*smoothstep(0.,1.5/255.,col.a),0.);
  gl_FragColor=col*uFirst;
}`;
const UNIFORMS = ["uBore", "uChan", "uRiver", "uPond", "uFlow", "uBoreFlow", "uFirst"];
const layers = ["st-gl-open", "st-gl-bore"].map((name, i) =>
  glLayer({ canvas: stage.querySelector(`.${name}`), fragment: WATER_GLSL, view: [D.W, D.H], camera: D.camera, uniforms: UNIFORMS, fixed: { uWhich: i, uLight: pale ? 1 : 0 } }),
);
let first = 0;
const water = layers.every(Boolean)
  ? {
      draw(time, dt) {
        first = still.matches ? 1 : Math.min(1, first + dt / 0.9);
        const values = {
          uBore: flood > 0.001 ? D.ZC + D.LOW[0] + flood * (D.RI + 2 - D.LOW[0]) : 0,
          uChan: channelZ(),
          uRiver: riverZ(),
          uPond: pondZ(),
          uFlow: 6 + 30 * clampTo(sim.flow / 265, 0, 1),
          uBoreFlow: 10 + 50 * clampTo((sim.flow - MODE2) / 190, 0, 1),
          uFirst: first,
        };
        layers.forEach((layer) => layer.draw(values, time));
      },
    }
  : null;
if (water) stage.setAttribute("data-gl", "");

// ------------------------------------------------------------ readout and words
let lastText = "";
let lastPhase = sim.phase;
function say() {
  const text = readoutOf(sim);
  if (text !== lastText) {
    readout.textContent = text;
    lastText = text;
  }
  if (sim.phase !== lastPhase) {
    lastPhase = sim.phase;
    said.textContent = `Mode ${PHASES[sim.phase].mode}: motorway ${PHASES[sim.phase].deck}.`;
  }
}
function setRain(next) {
  next = clampTo(next, 0, 3);
  if (next === rain) return;
  rain = next;
  stage.setAttribute("aria-valuenow", String(rain + 1));
  stage.setAttribute("aria-valuetext", RAIN_WORDS[rain]);
  if (still.matches) settleNow();
  kick();
}
// Reduced motion: run the model to where this rainfall leads and show that still.
function settleNow() {
  for (let i = 0; i < 30 * 160; i++) {
    sim = step(sim, rain, 0, 1 / 30);
  }
  flood = sim.fill;
  lift = sim.flow > MODE2 ? 1 : 0;
  leaf = sim.gate;
  arm = trafficOpen(sim.phase) ? 1 : 0;
  crew = sim.phase === "cleaning" ? 1 : 0;
  parkTraffic(trafficOpen(sim.phase));
}

// ------------------------------------------------------------ tour
const TOUR = [
  { rain: 0, hold: 4 },
  { rain: 1, hold: 9 },
  { rain: 2, until: () => sim.phase === "closed", hold: 4 },
  { rain: 3, until: () => sim.phase === "flooded", hold: 5 },
  { rain: 0, until: () => sim.phase === "open" && cars.length > 3, hold: 5 },
];
let touring = !still.matches;
let tourAt = 0;
let tourHold = 0;
let quiet = 0;
function tour(dt) {
  const stop = TOUR[tourAt];
  setRain(stop.rain);
  if (stop.until && !stop.until()) return;
  tourHold += dt;
  if (tourHold < stop.hold) return;
  tourHold = 0;
  tourAt = (tourAt + 1) % TOUR.length;
}
function interact() {
  touring = false;
  clearTimeout(quiet);
  if (!still.matches)
    quiet = setTimeout(() => {
      touring = true;
      tourAt = 0;
      tourHold = 0;
    }, 9000);
}
stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  const box = stage.getBoundingClientRect();
  interact();
  setRain(Math.floor(clampTo((event.clientX - box.left) / box.width, 0, 0.999) * 4));
});
stage.addEventListener("pointerdown", (event) => {
  const box = stage.getBoundingClientRect();
  interact();
  setRain(Math.floor(clampTo((event.clientX - box.left) / box.width, 0, 0.999) * 4));
});
stage.addEventListener("keydown", (event) => {
  const keys = { ArrowRight: rain + 1, ArrowUp: rain + 1, ArrowLeft: rain - 1, ArrowDown: rain - 1, Home: 0, End: 3, 1: 0, 2: 1, 3: 2, 4: 3 };
  if (!(event.key in keys)) return;
  event.preventDefault();
  interact();
  setRain(keys[event.key]);
});

// ------------------------------------------------------------ loop
let frame = 0;
let last = 0;
let visible = false;
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) tour(dt);
  if (!calm) {
    clock += dt;
    sim = step(sim, rain, cars.length, dt);
    const open = trafficOpen(sim.phase);
    stepTraffic(dt, open);
    const follow = (x, target, tau) => x + (target - x) * (1 - Math.exp(-dt / tau));
    flood = follow(flood, sim.fill, 0.5);
    lift = follow(lift, sim.flow > MODE2 || sim.phase === "flooding" || sim.phase === "flooded" ? 1 : 0, 0.8);
    leaf = follow(leaf, sim.gate, 0.25);
    arm = follow(arm, open ? 1 : 0, 0.35);
    crew = follow(crew, sim.phase === "cleaning" ? 1 : 0, 0.6);
  }
  drawLift();
  drawTraffic();
  drawGates();
  drawBarriers(trafficOpen(sim.phase));
  drawSelector(PHASES[sim.phase].mode);
  for (const deck of ["low", "up"]) {
    const top = D.ZC + (deck === "low" ? D.LOW[1] : D.UPP[1]);
    part(`silt-${deck}`).style.opacity = (0.55 * sim.silt * (boreZ() < top ? 1 : 0)).toFixed(3);
  }
  stage.querySelectorAll("[data-beacon]").forEach((b) => (b.style.opacity = calm ? "1" : (0.35 + 0.65 * (Math.sin(clock * 9) > 0 ? 1 : 0.2)).toFixed(2)));
  drawFallback();
  if (water) water.draw(calm ? 0.8 : clock, dt);
  say();
  frame = visible && !calm ? requestAnimationFrame(tick) : 0;
}
function kick() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) kick();
  },
  { rootMargin: "120px 0px" },
).observe(stage);
if (still.matches) settleNow();
window.__st = { get sim() { return sim; }, get cars() { return cars.length; }, setRain, set touring(v) { touring = v; } };
</script></body></html>
